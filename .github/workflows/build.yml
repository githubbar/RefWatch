name: Build

# Debug APKs are built for every push/PR to main.
# Pushing a tag like `v1.1.7` builds release APKs + AABs and publishes a GitHub Release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release artifacts (instead of debug)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create the GitHub Release on tags

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests. Runs in parallel with the build and does NOT gate it.
  # To make a red test block the build/release, add `needs: unit-tests` below.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'CI_PLACEHOLDER_KEY' }}" > local.properties

      - run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :common:testDebugUnitTest :mobile:testDebugUnitTest :wear:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Build. Debug on branches/PRs, release (+ signing + GitHub Release) on tags.
  # ---------------------------------------------------------------------------
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide build variant
        id: variant
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.build_release }}" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "HAS_KEYSTORE=$HAS_KEYSTORE" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # mobile/src/main/AndroidManifest.xml uses the ${MAPS_API_KEY} placeholder,
      # injected by the secrets-gradle-plugin from local.properties.
      - name: Write local.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'CI_PLACEHOLDER_KEY' }}" > local.properties

      - run: chmod +x ./gradlew

      - name: Build debug APKs
        if: steps.variant.outputs.release != 'true'
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug --stacktrace

      # On a tag, versionName/versionCode come from the tag itself: v1.1.8 ->
      # versionName 1.1.8, versionCode 361180000 (mobile) / 361180001 (wear).
      # Off a tag, the fallback values in the module build files are used.
      - name: Build release APKs and AABs
        if: steps.variant.outputs.release == 'true'
        run: |
          set -euo pipefail
          VERSION_ARG=()
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_ARG=("-PversionName=${GITHUB_REF_NAME#v}")
            echo "Building version ${GITHUB_REF_NAME#v} from tag ${GITHUB_REF_NAME}"
          fi
          ./gradlew \
            :mobile:assembleRelease :wear:assembleRelease \
            :mobile:bundleRelease :wear:bundleRelease \
            "${VERSION_ARG[@]}" \
            --stacktrace

      # Neither app module declares a signingConfig, so Gradle's release output is
      # unsigned. It is signed here with the SDK tools when the keystore secrets exist.
      - name: Sign release artifacts
        if: steps.variant.outputs.release == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BUILD_TOOLS"

          for apk in mobile/build/outputs/apk/release/*-unsigned.apk \
                     wear/build/outputs/apk/release/*-unsigned.apk; do
            [ -e "$apk" ] || continue
            aligned="${apk%.apk}-aligned.apk"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "${apk%-unsigned.apk}.apk" \
              "$aligned"
            rm -f "$aligned"
            echo "Signed ${apk%-unsigned.apk}.apk"
          done

          for aab in mobile/build/outputs/bundle/release/*.aab \
                     wear/build/outputs/bundle/release/*.aab; do
            [ -e "$aab" ] || continue
            jarsigner -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              "$aab" "$KEY_ALIAS"
            echo "Signed $aab"
          done

          rm -f "$KEYSTORE"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # copy <glob> <target-basename>
          copy() {
            for f in $1; do
              [ -e "$f" ] || continue
              # skip the leftover unsigned APK when a signed one was produced
              case "$f" in
                *-unsigned.apk) [ -e "${f%-unsigned.apk}.apk" ] && continue ;;
              esac
              cp "$f" "artifacts/$2-$VERSION.${f##*.}"
            done
          }

          if [[ "${{ steps.variant.outputs.release }}" == "true" ]]; then
            copy "mobile/build/outputs/apk/release/*.apk" "refwatch-mobile-release"
            copy "wear/build/outputs/apk/release/*.apk" "refwatch-wear-release"
            copy "mobile/build/outputs/bundle/release/*.aab" "refwatch-mobile-release"
            copy "wear/build/outputs/bundle/release/*.aab" "refwatch-wear-release"
          else
            copy "mobile/build/outputs/apk/debug/*.apk" "refwatch-mobile-debug"
            copy "wear/build/outputs/apk/debug/*.apk" "refwatch-wear-debug"
          fi
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: refwatch-${{ steps.collect.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            RefWatch ${{ github.ref_name }}

            | Artifact | Install on |
            | --- | --- |
            | `refwatch-mobile-release-*.apk` | Phone |
            | `refwatch-wear-release-*.apk` | Wear OS watch (`adb install`) |
            | `*.aab` | Play Console upload |

            ${{ env.SIGNED == 'true' && 'Artifacts are signed with the release keystore.' || '⚠️ Unsigned build — add the ANDROID_KEYSTORE_* repository secrets to produce installable, signed APKs.' }}
